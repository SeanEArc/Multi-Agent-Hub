[project]
name = "multi-agent-hub-backend"
version = "0.1.0"
description = "FastAPI backend for Multi-Agent Hub: agent sessions, events and history."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.16",
    "alembic>=1.16",
    "httpx2>=2.16.0",
    "pyyaml>=6.0.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "betteroffice-xlsx==0.2.2",
    "betteroffice-docx==0.2.2",
    "pypdfium2>=5.15.2",
]

[project.scripts]
# The hub's document toolkit for agents (app/doctool). The hub copies this launcher into a bin folder of its own
# and puts that on each agent's PATH (app/documents.py).
hub-doc = "app.doctool.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/script.py.mako", "migrations/versions/*.py", "doctool/scripts/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: test files are never on sys.path, so no test imports another; shared helpers are the `support`
# package in tests/ (asserts rewritten through conftest.py), and test files in different folders may share a name.
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
