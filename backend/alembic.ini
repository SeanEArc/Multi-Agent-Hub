# CLI config for creating migrations, e.g.:
#   uv run alembic revision --autogenerate -m "add tasks table"
# The database URL comes from app settings (HUB_DATABASE_URL); see app/migrations/env.py.
# Migrations run automatically at app startup.

[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
