# Weekly dependency update PRs, opened against staging so they go through CI like any other change.
# Minor and patch updates are grouped into one PR per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      shell-minor:
        update-types: [minor, patch]
