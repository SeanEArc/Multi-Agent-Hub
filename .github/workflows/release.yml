# Builds and publishes a release when a version tag (v0.2.0, v0.3.0-beta.1) is pushed. See RELEASING.md.
#
#   1. check:   the tag is on main, CI passed on it, every file has the tag's version, CHANGELOG.md has
#               its notes and a sample database was saved for the upgrade tests
#   2. build:   the Windows installer (PyInstaller backend + Tauri shell + NSIS), kept as a run artifact
#   3. publish: waits for approval in the `release` environment, then creates the GitHub Release
#
# Tags containing a hyphen (v0.3.0-beta.1) are published as prereleases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: Read the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
      - name: The tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are tagged on main after CI promotes staging."
            exit 1
          fi
      - name: Versions match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python3 scripts/version.py check --expect "$VERSION"
      - name: CHANGELOG.md has notes for it
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python3 scripts/version.py notes "$VERSION"
      - name: A sample database was saved for it
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          file="backend/tests/release_dbs/v$VERSION.sql"
          if [ ! -f "$file" ]; then
            echo "::error::$file is missing. Run: cd backend; uv run python scripts/snapshot_release_db.py $VERSION"
            exit 1
          fi
      # main only receives commits that passed CI on staging, so instead of running the tests again,
      # confirm that this commit's CI checks passed.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for check in "Versions match" "Backend tests (Windows)" "UI typecheck and build"; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\" and .conclusion == \"success\")] | length")
            if [ "$result" -lt 1 ]; then
              echo "::error::No passing \"$check\" check on $GITHUB_SHA. Push it through staging first."
              missing=1
            fi
          done
          exit $missing

  build:
    name: Build installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Rust is preinstalled on GitHub's Windows runners; this caches the compiled crates between releases.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frontend/src-tauri
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Install UI
        working-directory: frontend
        run: npm ci
      - name: Build (backend bundle, UI, NSIS installer)
        working-directory: frontend
        # beforeBuildCommand in tauri.conf.json runs the PyInstaller bundle and the Vite build first.
        run: npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this environment in the repository settings with yourself as a required reviewer; the job
    # waits for that approval. Download the installer from the run's artifacts to try it first.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          python3 scripts/version.py notes "$VERSION" > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Install:** download the `.exe` below and run it (Windows 10/11, installs for the current user).
          The installer isn't code-signed yet, so Windows SmartScreen may warn about an unknown publisher:
          choose **More info**, then **Run anyway**. You need the Claude Code and/or Codex CLI signed in with
          your own account, or Ollama for the local model; see the README.
          EOF
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Multi-Agent Hub $VERSION" \
            --notes-file notes.md "${flags[@]}"
